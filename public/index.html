<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kue Mas Aniz - Pelayan Toko Kue</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Marked library untuk parsing Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-info">
        <div class="avatar">
          <span>🧁</span>
        </div>
        <div>
          <h2>Kue Mas Aniz</h2>
          <p class="status"><span class="status-dot"></span> Pelayan Toko On-Site</p>
        </div>
      </div>
      <button id="reset-btn" class="reset-button" type="button" title="Mulai ulang sesi pesanan">
        <span>Mulai Ulang</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
          <path d="M21 3v5h-5"></path>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
          <path d="M3 21v-5h5"></path>
        </svg>
      </button>
    </header>

    <div id="chat-box" class="chat-box">
      <div class="message-wrapper bot">
        <div class="message bot">
          <p>Halo kak! Selamat datang di <strong>Toko Kue Mas Aniz</strong> 🧁</p>
          <p>Saya asisten pelayan toko yang siap bantu kakak memilih kue terlaris, cek stok & alergen, atau langsung mencatat pesanan kakak. Mau coba kue manis atau gurih hari ini kak?</p>
        </div>
      </div>
    </div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Tanya menu, cek stok, atau pesan kue..." maxlength="500" autocomplete="off" required />
      <button type="submit" id="send-btn">
        <span>Kirim</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>

</html>
