<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triva AI - Travel Assistant</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Marked library for parsing Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-info">
        <div class="avatar">
          <span>✨</span>
        </div>
        <div>
          <h2>Triva AI</h2>
          <p class="status"><span class="status-dot"></span> Online • Travel Assistant</p>
        </div>
      </div>
    </header>

    <div id="chat-box" class="chat-box">
      <div class="message-wrapper bot">
        <div class="message bot">
          <p>Halo! Saya <strong>Triva</strong>, travel assistant pribadi Anda ✈️🌴</p>
          <p>Mau liburan ke mana dan berapa lama? Ceritakan rencana Anda, dan saya siap buatkan itinerary terbaik!</p>
        </div>
      </div>
    </div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Tanyakan seputar liburan atau itinerary..." autocomplete="off" required />
      <button type="submit" id="send-btn">
        <span>Kirim</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>

</html>
